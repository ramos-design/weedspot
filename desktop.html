<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<title>WeedSpot — najdi své místo. Mapa friendly podniků v Česku a Evropě.</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#F7F2E7" />
<meta name="description" content="WeedSpot — komunitní mapa dispenzářů, CBD obchodů, kaváren, restaurací a coffeeshopů, které mají rády trávu. V Česku a po Evropě."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream-50:  #F7F2E7;
    --cream-100: #EFE8D6;
    --cream-200: #E4D9BD;
    --sand-200:  #D6CDB8;
    --sand-300:  #CDBE99;
    --moss-100:  #DCE3CD;
    --moss-600:  #52693E;
    --moss-700:  #3D5132;
    --moss-800:  #2C3A26;
    --moss-900:  #1F2A1C;
    --terracotta-100: #F2D8C7;
    --terracotta-500: #D17251;
    --terracotta-600: #B85A3C;
    --terracotta-700: #94422A;
    --mustard-100: #F2E5BD;
    --mustard-500: #E0A93A;
    --mustard-600: #C8902A;
    --bark-600: #5C4F3A;
    --bark-900: #332C20;
    --ink: #1A1812;

    --bg: var(--cream-50);
    --fg: var(--ink);
    --muted: var(--bark-600);
    --surface: #FFFFFF;
    --surface-2: var(--cream-100);
    --border: var(--cream-200);
    --accent: var(--terracotta-600);
    --accent-2: var(--mustard-600);
    --primary: var(--moss-600);

    --max-w: 1240px;
  }
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
  }
  button, input, textarea { font-family: inherit; }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }

  h1, h2, h3, h4 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 700; letter-spacing: -0.025em;
    line-height: 1.05; margin: 0;
  }

  .container { max-width: var(--max-w); margin: 0 auto; padding: 0 24px; }

  /* ─── HEADER ─────────────────────────────────────── */
  header.site {
    position: sticky; top: 0; z-index: 50;
    background: rgba(247, 242, 231, 0.78);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
  }
  header .row {
    display: flex; align-items: center; gap: 28px;
    height: 72px;
  }
  nav.primary { display: flex; gap: 28px; margin-left: 40px; flex: 1; }
  nav.primary a {
    font-size: 14px; font-weight: 500; color: var(--fg);
    transition: color 0.15s;
  }
  nav.primary a:hover { color: var(--accent); }
  header .actions { display: flex; gap: 8px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 0 18px; height: 42px; border-radius: 100px;
    font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid transparent;
    transition: transform 0.12s, background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn.primary { background: var(--accent); color: #F7F2E7; }
  .btn.primary:hover { background: var(--terracotta-700); }
  .btn.ghost { background: transparent; border-color: var(--border); color: var(--fg); }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.lg { height: 52px; padding: 0 22px; font-size: 15px; }

  .icon-btn {
    width: 42px; height: 42px; border-radius: 100px;
    background: transparent; border: 1px solid var(--border);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    color: var(--fg);
  }
  .icon-btn:hover { background: var(--surface-2); }

  .logo {
    display: inline-flex; align-items: center; line-height: 1;
    color: var(--fg);
  }
  .logo svg { flex-shrink: 0; display: block; }
  .logo .leaf { fill: var(--primary); }
  .logo .word { fill: currentColor; }

  /* ─── HERO ───────────────────────────────────────── */
  section.hero {
    position: relative; overflow: hidden;
    padding: 110px 0 120px;
    isolation: isolate;
  }
  .hero .bg-map {
    position: absolute; inset: 0; z-index: -1; pointer-events: none;
    opacity: 0.22;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
            mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
  }
  .hero .bg-map svg { width: 100%; height: 100%; }
  .hero .bg-tint {
    position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(circle at 20% 22%, rgba(184,90,60,0.07), transparent 55%),
      radial-gradient(circle at 80% 78%, rgba(82,105,62,0.10), transparent 60%);
  }
  .hero .inner {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    max-width: 820px; margin: 0 auto;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 100px;
    background: var(--moss-100); color: var(--moss-700);
    font-size: 13px; font-weight: 600; letter-spacing: 0;
  }
  .hero h1 {
    font-size: clamp(44px, 5.4vw, 72px);
    font-weight: 700; margin-top: 22px;
  }
  .hero h1 em {
    font-style: normal; color: var(--accent); font-weight: inherit;
  }
  .hero p.lead {
    font-size: 18px; color: var(--muted);
    margin: 18px auto 0; max-width: 540px;
  }

  /* Search hub — minimal, single bar with underline tabs above */
  .hero .search-hub {
    width: 100%; max-width: 720px; margin-top: 38px;
  }
  .hero .tabs {
    display: flex; justify-content: center; gap: 2px;
    margin-bottom: 14px;
  }
  .hero .tab {
    background: transparent; border: none; cursor: pointer;
    padding: 10px 18px; margin-bottom: -1px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .hero .tab:hover { color: var(--fg); }
  .hero .tab.active {
    color: var(--fg);
    border-bottom-color: var(--accent);
  }
  .hero .search-bar {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 6px 6px 6px 22px;
    box-shadow: 0 18px 44px rgba(28,42,30,0.10), 0 2px 6px rgba(28,42,30,0.04);
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .hero .search-bar:focus-within {
    border-color: var(--accent);
    box-shadow: 0 18px 44px rgba(28,42,30,0.14), 0 0 0 4px rgba(184,90,60,0.12);
  }
  .hero .search-bar svg.lead-ic { color: var(--muted); flex-shrink: 0; }
  .hero .search-bar input {
    flex: 1; min-width: 0; height: 56px;
    background: transparent; border: none; outline: none;
    font-size: 16px; color: var(--fg);
  }
  .hero .search-bar input::placeholder { color: var(--muted); }
  .hero .search-bar .go {
    height: 48px; padding: 0 22px; border-radius: 100px;
    background: var(--accent); color: #F7F2E7; border: none;
    font-size: 14px; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .hero .search-bar .go:hover { background: var(--terracotta-700); }

  .hero .stats {
    display: flex; justify-content: center; gap: 56px;
    margin-top: 64px; padding-top: 32px;
    border-top: 1px solid var(--border);
    width: 100%; max-width: 720px;
  }
  .stat-item { text-align: center; }
  .stat-item .num {
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 32px; letter-spacing: -0.025em;
    color: var(--fg);
  }
  .stat-item .lab { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* ─── SECTION TITLES ─────────────────────────────── */
  section { padding: 80px 0; }
  section.tight { padding: 56px 0; }
  .section-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 36px; }
  .section-head h2 { font-size: clamp(32px, 3.6vw, 48px); }
  .section-head .lead { color: var(--muted); margin-top: 10px; max-width: 520px; font-size: 16px; }
  .section-head .right { flex-shrink: 0; }

  /* ─── FEATURES (3 cols) ──────────────────────────── */
  .features {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
  }
  .feature {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 22px; padding: 28px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .feature:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(28,42,30,0.10); }
  .feature .ic-wrap {
    width: 52px; height: 52px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
  }
  .feature h3 { font-size: 22px; }
  .feature p { color: var(--muted); margin: 10px 0 0; font-size: 15px; }

  /* ─── CATEGORIES ─────────────────────────────────── */
  .cat-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
  }
  .cat-card {
    border-radius: 20px; padding: 24px; min-height: 180px;
    position: relative; overflow: hidden; cursor: pointer;
    display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
    transition: transform 0.15s;
  }
  .cat-card:hover { transform: translateY(-3px); }
  .cat-card .big-icon { position: absolute; right: -10px; bottom: -14px; font-size: 100px; opacity: 0.18; line-height: 1; }
  .cat-card .label { font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; line-height: 1.1; }
  .cat-card .count { font-size: 12px; opacity: 0.7; margin-top: 4px; font-weight: 500; }
  .cat-card .cta {
    align-self: flex-start; padding: 6px 12px;
    background: rgba(255,255,255,0.55); border-radius: 100px;
    font-size: 12px; font-weight: 700; position: relative; z-index: 1;
  }

  /* ─── MAP PREVIEW SECTION ────────────────────────── */
  .map-preview {
    position: relative; border-radius: 28px; overflow: hidden;
    aspect-ratio: 16/8; background: var(--surface-2);
    box-shadow: 0 24px 60px rgba(28,42,30,0.14);
    border: 1px solid var(--border);
  }
  .map-preview .pin {
    position: absolute; transform: translate(-50%,-100%);
    background: transparent; border: none; padding: 0; cursor: pointer;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
    transition: transform 0.15s;
  }
  .map-preview .pin:hover { transform: translate(-50%,-110%) scale(1.12); }
  .map-preview .legend {
    position: absolute; left: 24px; top: 24px;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
    border-radius: 16px; padding: 14px 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    display: flex; flex-direction: column; gap: 8px;
    border: 1px solid rgba(0,0,0,0.04);
  }
  .map-preview .legend .row {
    display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--fg); font-weight: 500;
  }
  .map-preview .legend .dot { width: 10px; height: 10px; border-radius: 100px; }
  .map-preview .open-cta {
    position: absolute; right: 24px; bottom: 24px;
  }

  /* ─── FEATURED SPOTS ─────────────────────────────── */
  .spot-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px;
  }
  .spot-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 22px; overflow: hidden; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex; flex-direction: column;
  }
  .spot-card:hover { transform: translateY(-3px); box-shadow: 0 18px 40px rgba(28,42,30,0.12); }
  .spot-photo { height: 200px; position: relative; flex-shrink: 0; overflow: hidden; }
  .spot-photo .gradient { position: absolute; inset: 0; background: radial-gradient(circle at 25% 20%, rgba(255,255,255,0.20), transparent 55%), radial-gradient(circle at 75% 90%, rgba(0,0,0,0.18), transparent 60%); }
  .spot-photo .ic { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 72px; opacity: 0.45; color: #F7F2E7; }
  .spot-photo .badge {
    position: absolute; top: 14px; left: 14px;
    background: rgba(255,255,255,0.94); color: var(--ink);
    padding: 5px 11px; border-radius: 100px; font-size: 11px; font-weight: 700;
  }
  .spot-photo .save {
    position: absolute; top: 12px; right: 12px;
    width: 38px; height: 38px; border-radius: 100px; background: rgba(255,255,255,0.94);
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--ink);
  }
  .spot-photo .save.saved { color: var(--accent); }
  .spot-body { padding: 18px 20px 22px; flex: 1; display: flex; flex-direction: column; }
  .spot-body .name { font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; line-height: 1.15; }
  .spot-body .meta { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .spot-body .meta .open { color: var(--moss-600); font-weight: 600; }
  .spot-body .meta .closed { color: var(--terracotta-700); font-weight: 600; }
  .spot-body .desc { color: var(--muted); margin-top: 10px; font-size: 14px; flex: 1; }
  .spot-body .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .spot-body .tag {
    font-size: 11px; font-weight: 500; color: var(--muted);
    padding: 4px 10px; border-radius: 100px;
    background: var(--surface-2); border: 1px solid var(--border);
  }

  /* ─── HOW IT WORKS ───────────────────────────────── */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .step .num {
    font-family: 'Fraunces', serif; font-weight: 800; font-size: 56px;
    color: var(--accent); letter-spacing: -0.04em; line-height: 1;
  }
  .step h3 { font-size: 22px; margin-top: 8px; }
  .step p { color: var(--muted); margin-top: 8px; font-size: 15px; }

  /* ─── REVIEWS ────────────────────────────────────── */
  .reviews-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .review {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 22px;
  }
  .review .stars { color: var(--mustard-600); font-size: 16px; letter-spacing: 1px; }
  .review .text { font-family: 'Fraunces', serif; font-weight: 500; font-size: 18px; line-height: 1.45; margin-top: 10px; letter-spacing: -0.005em; }
  .review .author { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .review .av { width: 38px; height: 38px; border-radius: 100px; color: #F7F2E7; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-weight: 700; font-size: 16px; }
  .review .who { font-size: 13px; font-weight: 600; }
  .review .when { font-size: 12px; color: var(--muted); }

  /* ─── CTA BANNER ─────────────────────────────────── */
  .cta-banner {
    margin: 60px 24px;
    background:
      radial-gradient(circle at 15% 20%, rgba(196,144,42,0.30), transparent 50%),
      radial-gradient(circle at 90% 80%, rgba(184,90,60,0.34), transparent 60%),
      linear-gradient(135deg, var(--moss-700), var(--moss-900));
    color: var(--cream-50);
    border-radius: 32px;
    padding: 64px 56px;
    display: grid; grid-template-columns: 1.5fr 1fr; gap: 32px; align-items: center;
    max-width: var(--max-w); margin-left: auto; margin-right: auto;
    position: relative; overflow: hidden;
  }
  .cta-banner h2 { font-size: clamp(34px, 4vw, 52px); color: var(--cream-50); }
  .cta-banner p { color: rgba(247,242,231,0.78); font-size: 17px; margin-top: 14px; max-width: 480px; }
  .cta-banner .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
  .cta-banner .right { justify-self: end; }
  .phone-mock {
    width: 240px; height: 480px; border-radius: 38px; padding: 8px;
    background: #0a0a0a; box-shadow: 0 24px 60px rgba(0,0,0,0.50);
    position: relative;
  }
  .phone-mock .screen {
    width: 100%; height: 100%; border-radius: 32px;
    background: var(--cream-50);
    overflow: hidden; position: relative;
  }
  .phone-mock .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 84px; height: 22px; background: #000; border-radius: 100px; z-index: 5; }

  /* ─── FOOTER ─────────────────────────────────────── */
  footer.site {
    background: var(--moss-900); color: var(--cream-50);
    padding: 64px 0 32px;
  }
  footer .grid {
    display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 48px;
  }
  footer h4 { font-family: 'Fraunces', serif; font-weight: 700; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mustard-500); margin-bottom: 16px; }
  footer ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  footer ul a { font-size: 14px; color: rgba(247,242,231,0.74); }
  footer ul a:hover { color: var(--cream-50); }
  footer .about p { color: rgba(247,242,231,0.68); font-size: 14px; max-width: 320px; margin-top: 14px; }
  footer .bottom {
    margin-top: 48px; padding-top: 24px; border-top: 1px solid rgba(247,242,231,0.10);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    font-size: 12px; color: rgba(247,242,231,0.55);
  }
  footer .legal-note {
    margin-top: 14px; padding: 14px 18px; border-radius: 14px;
    background: rgba(247,242,231,0.05); border: 1px solid rgba(247,242,231,0.10);
    font-size: 12px; color: rgba(247,242,231,0.66); line-height: 1.55;
  }

  /* ─── MODAL (search/submit/detail) ───────────────── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20,20,15,0.55); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    backdrop-filter: blur(4px);
    animation: fadeIn 0.2s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg); border-radius: 24px; max-width: 720px; width: 100%;
    max-height: 86vh; overflow-y: auto; box-shadow: 0 24px 80px rgba(0,0,0,0.40);
    border: 1px solid var(--border);
    animation: slideUp 0.25s cubic-bezier(0.32,0.72,0,1);
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.98);} to { opacity: 1; transform: none; } }
  .modal-head {
    padding: 22px 28px 14px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 1;
  }
  .modal-head h2 { font-size: 24px; }
  .modal-body { padding: 22px 28px 28px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted); }
  .field input, .field textarea {
    width: 100%; padding: 12px 16px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 15px; color: var(--fg); outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 100px; line-height: 1.5; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip-row .chip {
    height: 36px; padding: 0 14px; border-radius: 100px;
    background: var(--surface); color: var(--fg); border: 1px solid var(--border);
    font-size: 13px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip-row .chip.active { background: var(--accent); color: #F7F2E7; border-color: var(--accent); }

  /* ─── SEARCH MODAL ─────────────────────────────── */
  .search-modal { padding: 18px 24px 28px; }
  .search-input-row {
    display: flex; gap: 10px; align-items: center;
    padding: 8px 14px; border-radius: 100px; background: var(--surface);
    border: 1px solid var(--border);
  }
  .search-input-row input {
    flex: 1; background: transparent; border: none; outline: none;
    font-size: 16px; color: var(--fg); height: 36px;
  }
  .search-results { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; max-height: 50vh; overflow-y: auto; }
  .search-result {
    display: flex; gap: 14px; padding: 12px; border-radius: 14px;
    cursor: pointer; align-items: center;
  }
  .search-result:hover { background: var(--surface-2); }
  .search-result .thumb {
    width: 50px; height: 50px; border-radius: 12px; flex-shrink: 0;

// HERO
const HERO_GROUPS = [
  { id: "all",     label: "Vše",      icon: "✦",  cats: [] },
  { id: "obchody", label: "Obchody",  icon: "🌿", cats: ["disp", "cbd", "shop"] },
  { id: "gastro",  label: "Gastro",   icon: "☕", cats: ["cafe", "rest", "bar"] },
  { id: "akce",    label: "Akce",     icon: "✦",  cats: ["event"] },
];

function Hero({ onSearch }) {
  const [group, setGroup] = useState("all");
  const [q, setQ] = useState("");

  const placeholders = {
    all:     "Co hledáš? Spot, kategorii, město…",
    obchody: "Hledat dispenzář, CBD obchod, coffeeshop…",
    gastro:  "Hledat kavárnu, restauraci, bar…",
    akce:    "Hledat akci, festival, party…",
  };

  const submit = () => {
    const g = HERO_GROUPS.find(x => x.id === group);
    onSearch({ query: q.trim(), cats: g ? g.cats : [] });
  };
  const onKey = (e) => { if (e.key === "Enter") submit(); };

  return (
    <section className="hero">
      <div className="bg-tint"/>
      <div className="bg-map"><MapBg/></div>

      <div className="container">
        <div className="inner">
          <span className="eyebrow">● Nyní v 6 evropských městech</span>{/* keeps original casing */}
          <h1>Konečně vyhledávač, který rozumí <em>konopí.</em></h1>

          <div className="search-hub">
            <div className="tabs">
              {HERO_GROUPS.map(g => (
                <button
                  key={g.id}
                  className={"tab" + (group === g.id ? " active" : "")}
                  onClick={() => setGroup(g.id)}
                >
                  {g.label}
                </button>
              ))}
            </div>
            <div className="search-bar">
              <SearchIc size={20} className="lead-ic"/>
              <input
                value={q}
                onChange={e => setQ(e.target.value)}
                onKeyDown={onKey}
                placeholder={placeholders[group] || placeholders.all}
              />
              <button className="go" onClick={submit}>
                <SearchIc size={16}/><span className="lab">Hledat</span>
              </button>
            </div>
          </div>

          <div className="stats">
            <div className="stat-item"><div className="num">2 400+</div><div className="lab">Ověřených spotů</div></div>
            <div className="stat-item"><div className="num">18 200</div><div className="lab">Recenzí v komunitě</div></div>
            <div className="stat-item"><div className="num">6</div><div className="lab">Měst v Evropě</div></div>
          </div>
        </div>
      </div>
    </section>
  );
}

// SEARCH MODAL
function SearchModal({ onClose, onOpenSpot, initialQuery = "", initialCats = [] }) {
  const [q, setQ] = useState(initialQuery);
  const [cats, setCats] = useState(() => Array.isArray(initialCats) ? initialCats : []);
  const inputRef = useRef(null);
  useEffect(() => { inputRef.current?.focus(); }, []);

  let list = cats.length === 0 ? SPOTS : SPOTS.filter(s => cats.includes(s.cat));
  if (q) {
    const qq = q.toLowerCase();
    list = list.filter(s => s.name.toLowerCase().includes(qq) || s.tags.some(t => t.toLowerCase().includes(qq)) || s.area.toLowerCase().includes(qq));
  }

  const toggleCat = (id) => {
    setCats(prev => {
      if (prev.length === 1 && prev[0] === id) return [];
      return [id];
    });
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h2>Hledat spot</h2>
          <button className="icon-btn" onClick={onClose}><CloseIc size={20}/></button>
        </div>
        <div className="search-modal">
          <div className="search-input-row">
            <SearchIc size={18}/>
            <input ref={inputRef} value={q} onChange={e => setQ(e.target.value)} placeholder="Najít spot, kategorii, město…"/>
            {q && <button className="icon-btn" onClick={() => setQ("")} style={{ width: 32, height: 32, border: "none" }}><CloseIc size={14}/></button>}
          </div>

          <div style={{ marginTop: 14 }} className="chip-row">
            <button className={"chip" + (cats.length === 0 ? " active" : "")} onClick={() => setCats([])}>Vše</button>
            {CATEGORIES.map(c => (
              <button key={c.id} className={"chip" + (cats.includes(c.id) ? " active" : "")} onClick={() => toggleCat(c.id)}>
                <span>{c.icon}</span>{c.label}
              </button>
            ))}
          </div>

          <div className="search-results">
            {list.map(s => {
              const cd = CATEGORIES.find(c => c.id === s.cat);
              const tone = TONE[s.img];
              return (
                <div key={s.id} className="search-result" onClick={() => { onOpenSpot(s.id); onClose(); }}>
                  <div className="thumb" style={{ background: tone.bg }}>{cd.icon}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 16, letterSpacing: "-0.02em" }}>{s.name}</div>
                    <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 2 }}>
                      {cd.label} · {s.area} · ★ {s.rating}
                    </div>
                  </div>
                  <ChevronR size={18}/>
                </div>
              );
            })}
            {list.length === 0 && (
              <div style={{ padding: 36, textAlign: "center", color: "var(--muted)" }}>
                <div style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 20, color: "var(--fg)" }}>Nic jsme nenašli.</div>
                <div style={{ marginTop: 4, fontSize: 14 }}>Zkus jiný výraz nebo rozšiř kategorii.</div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 420 }}>
        <div className="modal-head">
          <Logo size={20}/>
          <button className="icon-btn" onClick={onClose}><CloseIc size={20}/></button>
        </div>
        <div className="modal-body">
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            {[
              ["mapa.html", "Mapa"],
              ["/obchody", "Obchody"],
              ["/znacky", "Značky"],
              ["/produkty", "Produkty"],
              ["/akce", "Akce"],
              ["/eventy", "Eventy"],
              ["/edukace", "Edukace"],
              ["/komunita", "Komunita"],
            ].map(([href, label]) => (
              <a key={href} href={href} onClick={onClose} style={{ padding: "14px 4px", fontSize: 18, fontFamily: "'Fraunces', serif", fontWeight: 600, borderBottom: "1px solid var(--border)" }}>{label}</a>
            ))}
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
            <button className="btn ghost" style={{ flex: 1 }} onClick={() => { onSearch(); onClose(); }}><SearchIc size={16}/>Hledat</button>
            <button className="btn primary" style={{ flex: 1 }} onClick={() => { onAdd(); onClose(); }}><PlusIc size={16}/>Přidat spot</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// APP
function App() {
  const [searchOpen, setSearchOpen] = useState(false);
  const [searchInit, setSearchInit] = useState({ query: "", cats: [] });
  const [submitOpen, setSubmitOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [openSpotId, setOpenSpotId] = useState(null);

  const openSearch = useCallback((seed) => {
    setSearchInit({
      query: seed && typeof seed.query === "string" ? seed.query : "",
      cats:  seed && Array.isArray(seed.cats)       ? seed.cats  : [],
    });
    setSearchOpen(true);
  }, []);
  const [savedIds, setSavedIds] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem("ws-saved") || "[1,4]")); }
    catch { return new Set([1, 4]); }
  });
  const [toast, setToast] = useState(null);

  useEffect(() => { localStorage.setItem("ws-saved", JSON.stringify([...savedIds])); }, [savedIds]);

  const showToast = useCallback((m) => { setToast(m); setTimeout(() => setToast(null), 1800); }, []);
  const toggleSave = useCallback((id) => {
    setSavedIds(prev => {
      const n = new Set(prev);
      if (n.has(id)) { n.delete(id); showToast("Odebráno z uložených"); }
      else { n.add(id); showToast("Uloženo"); }
      return n;
    });
  }, [showToast]);

  return (
    <>
      <Header
        onSearch={() => openSearch()}
        onMenu={() => setMenuOpen(true)}
        onSaved={() => { const el = document.getElementById("featured"); if (el) el.scrollIntoView({ behavior: "smooth" }); }}
        onLogin={() => alert("Přihlášení – brzy 🌱")}
        onNotifications={() => showToast("Žádné nové notifikace")}
      />
      <Hero onSearch={openSearch}/>
      <Features/>
      <CategoriesSection onSearch={() => openSearch()}/>
      <MapSection onOpenSpot={setOpenSpotId} onAdd={() => setSubmitOpen(true)}/>
      <FeaturedSection onOpenSpot={setOpenSpotId} savedIds={savedIds} onToggleSave={toggleSave}/>
      <HowItWorks/>
      <ReviewsSection/>
      <CtaBanner onSearch={() => openSearch()}/>
      <Footer/>

      {searchOpen && <SearchModal onClose={() => setSearchOpen(false)} onOpenSpot={setOpenSpotId} initialQuery={searchInit.query} initialCats={searchInit.cats}/>}
      {submitOpen && <SubmitModal onClose={() => setSubmitOpen(false)} showToast={showToast}/>}
      {openSpotId && <DetailModal spotId={openSpotId} onClose={() => setOpenSpotId(null)} savedIds={savedIds} onToggleSave={toggleSave} showToast={showToast}/>}
      {menuOpen && <MobileMenu onClose={() => setMenuOpen(false)} onSearch={() => openSearch()} onAdd={() => setSubmitOpen(true)}/>}
      {toast && <div className="toast">{toast}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
