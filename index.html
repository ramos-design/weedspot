  }

  input, textarea { font-family: inherit; }

  /* Stage: on desktop, frame the phone. On mobile, fill the screen. */
  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 20% 0%, rgba(184,90,60,0.18), transparent 50%),

  .phone {

    border-radius: 54px;

    box-shadow:

      0 40px 80px rgba(0,0,0,0.55),

  }
  .phone .notch {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);

    pointer-events: none;
  }
  .phone .home-bar {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);

    pointer-events: none;

  html.dark .phone .home-bar { background: rgba(247,242,231,0.40); }
  .screen {
    position: absolute; inset: 0;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 150;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px 0 28px; pointer-events: none;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 15px;
    color: var(--fg); padding-top: 16px;
  }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }

  /* Tweaks panel */
  .tweaks {
    position: fixed; right: 16px; top: 16px; z-index: 1000;
    background: rgba(28,42,30,0.92); color: #F7F2E7;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(247,242,231,0.12);
    border-radius: 16px; padding: 12px 14px;
    font-family: 'DM Sans', sans-serif; font-size: 12px;
    display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.30);
  }
  .tweaks .tw-label { color: rgba(247,242,231,0.6); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; }
  .tweaks .tw-row { display: flex; gap: 6px; }
  .tweaks button {
    background: rgba(247,242,231,0.10); border: 1px solid rgba(247,242,231,0.10);
    color: #F7F2E7; padding: 6px 10px; border-radius: 100px; font-size: 11px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .tweaks button.active { background: var(--terracotta-600); border-color: var(--terracotta-600); }

  /* Mobile: fullscreen */
  @media (max-width: 480px), (max-height: 880px) and (max-width: 480px) {
    .stage { background: var(--bg); }
    .phone {
      width: 100vw; height: 100vh; border-radius: 0; box-shadow: none;
    }
    .phone .notch { display: none; }
    .phone .home-bar { display: none; }
    .status-bar {
      padding-top: env(safe-area-inset-top, 16px);
      height: calc(54px + env(safe-area-inset-top, 0px));
    }
    .tweaks { right: 8px; top: calc(env(safe-area-inset-top, 8px) + 8px); padding: 8px 10px; }
  }

  @media (max-height: 880px) and (min-width: 481px) {
    .phone { transform: scale(min(1, calc((100vh - 60px) / 852))); transform-origin: center; }
  }

  /* utility classes used inline */
  .scroll { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }

  /* spinner-free range styling */
  input[type=range] { accent-color: var(--accent); }

  /* prevent text selection on UI surfaces but allow on inputs */
  .ui { user-select: none; -webkit-user-select: none; }

  /* fade transition between screens */
  .screen-enter { animation: fadeUp 0.24s ease-out; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none; } }

  .toast {
    position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: var(--moss-800); color: var(--cream-50);
    padding: 10px 16px; border-radius: 100px; font-size: 13px; font-weight: 600;
    z-index: 500; box-shadow: 0 6px 20px rgba(0,0,0,0.30);
    animation: toastIn 0.3s ease-out;
  }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px);} to { opacity: 1; transform: translate(-50%, 0);} }
</style>

// SCREEN: HOME (mapa + bottom-sheet feed)
// ────────────────────────────────────────────────────────────────────────────
function Home({ onNav, onOpenSpot, savedIds, onToggleSave, dark }) {
  const [sheetState, setSheetState] = useState("mid"); // "low" | "mid" | "high"
  const [filter, setFilter] = useState("all");
  const filtered = filter === "all" ? SPOTS : SPOTS.filter(s => s.cat === filter);
  const SHEET = { low: 130, mid: 420, high: 720 };
  const sheetH = SHEET[sheetState];

  // drag handle
  const dragRef = useRef({ y0: 0, h0: 0, dragging: false });
  const [dragH, setDragH] = useState(null);

  const onPointerDown = (e) => {
    dragRef.current = { y0: e.clientY, h0: sheetH, dragging: true };
    e.currentTarget.setPointerCapture(e.pointerId);
    setDragH(sheetH);
  };
  const onPointerMove = (e) => {
    if (!dragRef.current.dragging) return;
    const dy = dragRef.current.y0 - e.clientY;
    const next = Math.max(130, Math.min(720, dragRef.current.h0 + dy));
    setDragH(next);
  };
  const onPointerUp = () => {
    if (!dragRef.current.dragging) return;
    dragRef.current.dragging = false;
    const h = dragH || sheetH;
    const target = h < 250 ? "low" : h < 560 ? "mid" : "high";
    setSheetState(target);
    setDragH(null);
  };

  const liveH = dragH ?? sheetH;

  return (
    <div className="screen screen-enter" style={{ background: "var(--bg)" }}>
      <MapCanvas spots={SPOTS} onPinClick={onOpenSpot} dark={dark} />
      <StatusBar/>

      {/* Top bar */}
      <div style={{ position: "absolute", top: 64, left: 16, right: 16, display: "flex", flexDirection: "column", gap: 10, zIndex: 5 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div onClick={() => onNav("search")} style={{
            flex: 1, height: 48, borderRadius: 100, background: "var(--surface)",
            boxShadow: "0 2px 12px rgba(28,42,30,0.10)", display: "flex", alignItems: "center",
            padding: "0 18px", gap: 10, cursor: "pointer", border: `1px solid var(--border)`,
          }}>
            <SearchIcon size={18} color="var(--muted)"/>
            <span style={{ flex: 1, fontSize: 15, color: "var(--muted)" }}>Najít spot, město, kategorii…</span>
            <Logo size={11} color="var(--muted)" accent="var(--accent)"/>
          </div>
          <button style={{
            width: 48, height: 48, borderRadius: 100, background: "var(--surface)",
            boxShadow: "0 2px 12px rgba(28,42,30,0.10)", border: `1px solid var(--border)`,
            display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
          }}><FilterIcon size={18} color="var(--fg)"/></button>
        </div>
        <div className="no-scrollbar" style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4, marginRight: -16 }}>
          <Chip active={filter === "all"} onClick={() => setFilter("all")}>Vše</Chip>
          {CATEGORIES.map(c => (
            <Chip key={c.id} active={filter === c.id} onClick={() => setFilter(c.id)} icon={c.icon}>{c.label}</Chip>
          ))}
        </div>
      </div>

      {/* FAB */}
      <button style={{
        position: "absolute", right: 16, bottom: liveH + 16, zIndex: 5,
        width: 52, height: 52, borderRadius: 100, background: "var(--surface)",
        boxShadow: "0 4px 16px rgba(28,42,30,0.18)", border: `1px solid var(--border)`,
        display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
        transition: dragRef.current.dragging ? "none" : "bottom 0.25s cubic-bezier(0.32,0.72,0,1)",
      }}><LocateIcon size={22} color="var(--accent)"/></button>

      {/* Bottom sheet */}
      <div style={{
        position: "absolute", left: 0, right: 0, bottom: 0, zIndex: 6,
        height: liveH, background: "var(--bg)",
        borderTopLeftRadius: 24, borderTopRightRadius: 24,
        boxShadow: "0 -8px 32px rgba(28,42,30,0.14)",
        transition: dragRef.current.dragging ? "none" : "height 0.3s cubic-bezier(0.32,0.72,0,1)",
        display: "flex", flexDirection: "column", overflow: "hidden",
      }}>
        <div
          onPointerDown={onPointerDown} onPointerMove={onPointerMove}
          onPointerUp={onPointerUp} onPointerCancel={onPointerUp}
          style={{ padding: "10px 0 6px", display: "flex", justifyContent: "center", cursor: "grab", touchAction: "none" }}
          onClick={() => !dragRef.current.dragging && setSheetState(sheetState === "low" ? "mid" : sheetState === "mid" ? "high" : "low")}
        >
          <div style={{ width: 36, height: 5, borderRadius: 100, background: dark ? "rgba(247,242,231,0.28)" : "var(--sand-300)" }}/>
        </div>
        <div style={{ padding: "4px 20px 12px", display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
          <div>
            <div style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 22, letterSpacing: "-0.02em", color: "var(--fg)" }}>
              {filtered.length} spot{filtered.length === 1 ? "" : filtered.length < 5 ? "y" : "ů"} kolem vás
            </div>
            <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 2 }}>Praha 7 · do 2 km</div>
          </div>
          <div onClick={() => onNav("categories")} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 13, color: "var(--accent)", fontWeight: 600, cursor: "pointer" }}>
            Vše<span style={{ fontSize: 14 }}>›</span>
          </div>
        </div>
        <div className="scroll" style={{ flex: 1, padding: "0 20px 100px", display: "flex", flexDirection: "column", gap: 12 }}>
          {filtered.map(s => (
            <SpotCard key={s.id} spot={s} onClick={() => onOpenSpot(s.id)} saved={savedIds.has(s.id)} onToggleSave={onToggleSave}/>
          ))}
          {filtered.length === 0 && (
            <div style={{ padding: 32, textAlign: "center", color: "var(--muted)" }}>Žádné spoty pro tuto kategorii.</div>
          )}
        </div>
      </div>

      <TabBar active="home" onNav={onNav} dark={dark}/>
    </div>
  );
}

function SpotDetail({ spotId, onBack, savedIds, onToggleSave, dark, showToast }) {
  const spot = SPOTS.find(s => s.id === spotId) || SPOTS[0];
  const reviews = REVIEWS.filter(r => r.spot === spot.id);
  const cd = CATEGORIES.find(c => c.id === spot.cat);
  const tones = { moss: "var(--moss-700)", terracotta: "var(--terracotta-600)", mustard: "var(--mustard-600)" };
  const heroBg = tones[spot.img];
  const isSaved = savedIds.has(spot.id);

  const catColors = {
    moss:       { bg: "var(--moss-100)",       fg: "var(--moss-900)" },
    terracotta: { bg: "var(--terracotta-100)", fg: "var(--terracotta-700)" },
    mustard:    { bg: "var(--mustard-100)",    fg: "var(--bark-900)" },
  };
  const cc = catColors[cd.color];

  return (
    <div className="screen screen-enter scroll" style={{ background: "var(--bg)", color: "var(--fg)", overflowY: "auto" }}>
      {/* Hero */}
      <div style={{ position: "relative", height: 320, background: heroBg, overflow: "hidden", flexShrink: 0 }}>
        <div style={{ position: "absolute", inset: 0, background: "radial-gradient(circle at 20% 20%, rgba(255,255,255,0.18), transparent 50%), radial-gradient(circle at 80% 90%, rgba(0,0,0,0.20), transparent 60%)" }}/>
        <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 96, opacity: 0.45 }}>{cd.icon}</div>
        <StatusBar/>
        <div style={{ position: "absolute", top: 64, left: 16, right: 16, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <CircleBtn onClick={onBack}><ChevronLeft size={20} color="var(--ink)"/></CircleBtn>
          <div style={{ display: "flex", gap: 8 }}>
            <CircleBtn onClick={() => showToast("Sdílení zkopírováno")}><ShareIcon size={18} color="var(--ink)"/></CircleBtn>
            <CircleBtn onClick={() => onToggleSave(spot.id)}>
              <BookmarkIcon size={18} color={isSaved ? "var(--accent)" : "var(--ink)"} filled={isSaved}/>
            </CircleBtn>
          </div>
        </div>
        <div style={{ position: "absolute", bottom: 16, left: "50%", transform: "translateX(-50%)", display: "flex", gap: 5 }}>
          {[0,1,2,3].map(i => (
            <div key={i} style={{ width: i === 0 ? 18 : 5, height: 5, borderRadius: 3, background: i === 0 ? "white" : "rgba(255,255,255,0.5)" }}/>
          ))}
        </div>
      </div>

      <div style={{ padding: "20px 20px 60px" }}>
        <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
          <Pill bg={cc.bg} color={cc.fg}>{cd.label}</Pill>
          <Pill bg={spot.open ? "var(--moss-100)" : "transparent"} color={spot.open ? "var(--moss-900)" : "var(--terracotta-700)"}>
            {spot.open ? "● Otevřeno · " + spot.hours : "○ Zavřeno · " + spot.hours}
          </Pill>
        </div>
        <h1 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 32, letterSpacing: "-0.025em", lineHeight: 1.05, margin: 0 }}>{spot.name}</h1>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8, fontSize: 14, color: "var(--muted)" }}>
          <span style={{ color: "var(--fg)", fontWeight: 700 }}>★ {spot.rating}</span>
          <span>({spot.reviews} recenzí)</span>
          <span>·</span>
          <span>{spot.area}</span>
          <span>·</span>
          <span>{spot.dist}</span>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginTop: 18 }}>
          <ActionBtn onClick={() => showToast("Trasa nastavena")} icon={<DirectionIc size={18} color="#F7F2E7"/>} label="Trasa" primary/>
          <ActionBtn onClick={() => showToast("Volám…")} icon={<PhoneIcon size={18} color="var(--fg)"/>} label="Volat"/>
          <ActionBtn onClick={() => showToast("Sdílení zkopírováno")} icon={<ShareIcon size={18} color="var(--fg)"/>} label="Sdílet"/>
        </div>

        <SectionTitle>O místě</SectionTitle>
        <p style={{ fontSize: 15, lineHeight: 1.55, color: "var(--muted)", margin: 0, textWrap: "pretty" }}>{spot.desc}</p>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 14 }}>
          {spot.tags.map(tg => (
            <span key={tg} style={{ fontSize: 12, fontWeight: 500, color: "var(--muted)", padding: "6px 10px", borderRadius: 100, background: "var(--surface)", border: `1px solid var(--border)` }}>{tg}</span>
          ))}
        </div>

        <SectionTitle>Otevírací doba</SectionTitle>
        <div style={{ background: "var(--surface)", borderRadius: 16, padding: 14, border: `1px solid var(--border)` }}>
          {[
            ["Pondělí", "8:00 – 22:00"],
            ["Úterý", "8:00 – 22:00"],
            ["Středa", "8:00 – 22:00", true],
            ["Čtvrtek", "8:00 – 22:00"],
            ["Pátek", "8:00 – 24:00"],
            ["Sobota", "9:00 – 24:00"],
            ["Neděle", "9:00 – 20:00"],
          ].map(([d, h, today]) => (
            <div key={d} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", fontSize: 14, color: today ? "var(--fg)" : "var(--muted)", fontWeight: today ? 700 : 400 }}>
              <span>{d}{today && " · dnes"}</span>
              <span>{h}</span>
            </div>
          ))}
        </div>

        <SectionTitle>Adresa</SectionTitle>
        <div style={{ background: "var(--surface)", borderRadius: 16, overflow: "hidden", border: `1px solid var(--border)` }}>
          <div style={{ height: 140, background: "var(--surface-2)", position: "relative", overflow: "hidden" }}>
            <svg width="100%" height="100%" viewBox="0 0 360 140" preserveAspectRatio="xMidYMid slice">
              <line x1="0" y1="50" x2="360" y2="60" stroke={dark ? "rgba(247,242,231,0.18)" : "#E9DFC9"} strokeWidth="3"/>
              <line x1="0" y1="100" x2="360" y2="105" stroke={dark ? "rgba(247,242,231,0.12)" : "#EFE8D6"} strokeWidth="2"/>
              <line x1="180" y1="0" x2="190" y2="140" stroke={dark ? "rgba(247,242,231,0.12)" : "#EFE8D6"} strokeWidth="2"/>
            </svg>
            <div style={{ position: "absolute", left: "50%", top: "50%", transform: "translate(-50%,-100%)" }}>
              <svg width="36" height="44" viewBox="0 0 36 44">
                <path d="M 18 2 C 9 2, 2 9, 2 18 C 2 28, 18 42, 18 42 C 18 42, 34 28, 34 18 C 34 9, 27 2, 18 2 Z" fill="var(--accent)" stroke="white" strokeWidth="2.5"/>
              </svg>
            </div>
          </div>
          <div style={{ padding: 14, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 14, fontWeight: 600, color: "var(--fg)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{spot.address}</div>
              <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 2 }}>{spot.dist} od vás</div>
            </div>
            <button onClick={() => showToast("Otevírám mapu…")} style={{ background: "var(--accent)", color: "#F7F2E7", border: "none", borderRadius: 100, padding: "10px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap" }}>Otevřít</button>
          </div>
        </div>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginTop: 24 }}>
          <h2 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 22, letterSpacing: "-0.02em", margin: 0 }}>Recenze · {reviews.length}</h2>
          <span onClick={() => showToast("Recenze připraveny")} style={{ fontSize: 13, color: "var(--accent)", fontWeight: 600, cursor: "pointer" }}>Přidat recenzi</span>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 12 }}>
          {reviews.map(r => <ReviewCard key={r.id} r={r} dark={dark}/>)}
          {reviews.length === 0 && <div style={{ padding: 16, textAlign: "center", color: "var(--muted)", fontSize: 14 }}>Zatím žádné recenze.</div>}
        </div>
      </div>
    </div>
  );
}

function ActionBtn({ icon, label, primary, onClick }) {
  return (
    <button onClick={onClick} style={{
      height: 48, borderRadius: 14, border: primary ? "none" : `1px solid var(--border)`,
      background: primary ? "var(--accent)" : "var(--surface)",
      color: primary ? "#F7F2E7" : "var(--fg)",
      display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
      fontSize: 14, fontWeight: 600, cursor: "pointer", letterSpacing: "-0.01em",
    }}>
      {icon}{label}
    </button>
  );
}

function ReviewCard({ r, dark }) {
  const palette = ["var(--moss-700)", "var(--terracotta-600)", "var(--mustard-600)"];
  const avc = palette[r.user.charCodeAt(0) % 3];
  return (
    <div style={{ background: "var(--surface)", borderRadius: 16, padding: 14, border: `1px solid var(--border)` }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <div style={{ width: 36, height: 36, borderRadius: 100, background: avc, color: "#F7F2E7", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 16 }}>{r.avatar}</div>
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 600, fontSize: 14, color: "var(--fg)" }}>{r.user}</div>
          <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 1 }}>před {r.when}</div>
        </div>
        <div style={{ display: "flex", gap: 1 }}>
          {[1,2,3,4,5].map(i => (
            <span key={i} style={{ color: i <= r.rating ? "var(--mustard-600)" : (dark ? "rgba(247,242,231,0.20)" : "var(--sand-300)"), fontSize: 14 }}>★</span>
          ))}
        </div>
      </div>
      <p style={{ fontSize: 14, lineHeight: 1.5, color: "var(--fg)", marginTop: 10, marginBottom: 0, textWrap: "pretty" }}>{r.text}</p>
    </div>
  );
}

// ────────────────────────────────────────────────────────────────────────────
// SCREEN: SEARCH
// ────────────────────────────────────────────────────────────────────────────
function Search({ onBack, onOpenSpot, savedIds, onToggleSave, dark }) {
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(true);
  const [dist, setDist] = useState(2);
  const [cats, setCats] = useState([]);
  const recent = ["Café Listopad", "dispenzář Praha 7", "CBD oleje", "brunch terasa"];
  const trending = ["Otevřeno teď", "Nejlépe hodnocené", "Nové spoty", "Coffeeshopy NL"];

  let results = [];
  if (q) {
    results = SPOTS.filter(s =>
      s.name.toLowerCase().includes(q.toLowerCase()) ||
      s.tags.some(tg => tg.toLowerCase().includes(q.toLowerCase())) ||
      s.area.toLowerCase().includes(q.toLowerCase())
    );
    if (open) results = results.filter(s => s.open);
    if (cats.length) results = results.filter(s => cats.includes(s.cat));
  }

  return (
    <div className="screen screen-enter" style={{ background: "var(--bg)", color: "var(--fg)" }}>
      <StatusBar/>
      <div style={{ paddingTop: 64, padding: "64px 16px 12px", display: "flex", gap: 10, alignItems: "center" }}>
        <button onClick={onBack} style={{ background: "transparent", border: "none", padding: 0, cursor: "pointer", display: "flex" }}>
          <ChevronLeft size={26} color="var(--fg)"/>
        </button>
        <div style={{ flex: 1, height: 44, background: "var(--surface)", borderRadius: 100, border: `1px solid var(--border)`, display: "flex", alignItems: "center", padding: "0 16px", gap: 10 }}>
          <SearchIcon size={18} color="var(--muted)"/>
          <input autoFocus value={q} onChange={e => setQ(e.target.value)} placeholder="Najít spot, město, kategorii…"
            style={{ flex: 1, background: "transparent", border: "none", outline: "none", fontSize: 15, color: "var(--fg)", minWidth: 0 }}/>
          {q && <button onClick={() => setQ("")} style={{ background: "transparent", border: "none", cursor: "pointer", padding: 0, display: "flex" }}><CloseIcon size={16} color="var(--muted)"/></button>}
        </div>
      </div>

      <div className="scroll" style={{ flex: 1, padding: "8px 16px 100px", overflowY: "auto" }}>
        {!q && (
          <>
            <SectionLabel>Filtry</SectionLabel>
            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 8 }}>
              <FilterRow label="Otevřeno právě teď">
                <Switch on={open} onChange={setOpen}/>
              </FilterRow>
              <FilterRow label={`Vzdálenost do ${dist} km`}>
                <input type="range" min="0.5" max="10" step="0.5" value={dist} onChange={e => setDist(parseFloat(e.target.value))} style={{ width: 130 }}/>
              </FilterRow>
            </div>

            <SectionLabel>Kategorie</SectionLabel>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 4 }}>
              {CATEGORIES.map(c => {
                const isAct = cats.includes(c.id);
                return (
                  <button key={c.id} onClick={() => setCats(isAct ? cats.filter(x => x !== c.id) : [...cats, c.id])} style={{
                    height: 38, padding: "0 14px", borderRadius: 100,
                    background: isAct ? "var(--accent)" : "var(--surface)",
                    color: isAct ? "#F7F2E7" : "var(--fg)",
                    border: isAct ? "none" : `1px solid var(--border)`,
                    fontSize: 13, fontWeight: 600,
                    display: "flex", alignItems: "center", gap: 6, cursor: "pointer",
                  }}>
                    <span>{c.icon}</span>{c.label}
                  </button>
                );
              })}
            </div>

            <SectionLabel>Naposledy hledané</SectionLabel>
            <div style={{ display: "flex", flexDirection: "column" }}>
              {recent.map(r => (
                <button key={r} onClick={() => setQ(r)} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 4px", background: "transparent", border: "none", borderBottom: `1px solid var(--border)`, cursor: "pointer", textAlign: "left" }}>
                  <ClockIcon size={16} color="var(--muted)"/>
                  <span style={{ flex: 1, fontSize: 14, color: "var(--fg)" }}>{r}</span>
                  <ChevronRight size={16} color="var(--muted)"/>
                </button>
              ))}
            </div>

            <SectionLabel>Trendy</SectionLabel>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {trending.map(tr => (
                <button key={tr} onClick={() => setQ(tr)} style={{ height: 36, padding: "0 14px", borderRadius: 100, background: "var(--surface-2)", border: `1px solid var(--border)`, color: "var(--fg)", fontSize: 13, fontWeight: 500, cursor: "pointer" }}>{tr}</button>
              ))}
            </div>
          </>
        )}

        {q && (
          <>
            <div style={{ fontSize: 13, color: "var(--muted)", padding: "8px 4px 12px" }}>
              {results.length} výsledků pro „{q}"
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {results.map(s => <SpotCard key={s.id} spot={s} onClick={() => onOpenSpot(s.id)} saved={savedIds.has(s.id)} onToggleSave={onToggleSave}/>)}
              {results.length === 0 && (
                <div style={{ padding: "40px 0", textAlign: "center" }}>
                  <div style={{ fontSize: 48, opacity: 0.4 }}>·</div>
                  <div style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 20, color: "var(--fg)", marginTop: 8 }}>Nenašli jsme nic.</div>
                  <div style={{ fontSize: 14, color: "var(--muted)", marginTop: 4 }}>Zkuste jiný výraz nebo rozšiřte vzdálenost.</div>
                </div>
              )}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function FilterRow({ label, children }) {
  return (
    <div style={{ background: "var(--surface)", borderRadius: 14, padding: "12px 14px", display: "flex", alignItems: "center", justifyContent: "space-between", border: `1px solid var(--border)` }}>
      <span style={{ fontSize: 14, fontWeight: 500, color: "var(--fg)" }}>{label}</span>
      {children}
    </div>
  );
}

// ────────────────────────────────────────────────────────────────────────────
// SCREEN: CATEGORIES
// ────────────────────────────────────────────────────────────────────────────
function Categories({ onBack, onSelect, dark }) {
  const palette = {
    moss:       { bg: "var(--moss-100)",       fg: "var(--moss-900)" },
    terracotta: { bg: "var(--terracotta-100)", fg: "var(--terracotta-700)" },
    mustard:    { bg: "var(--mustard-100)",    fg: "var(--bark-900)" },
  };
  return (
    <div className="screen screen-enter scroll" style={{ background: "var(--bg)", color: "var(--fg)", overflowY: "auto" }}>
      <StatusBar/>
      <div style={{ padding: "64px 20px 12px", display: "flex", alignItems: "center", gap: 10 }}>
        <button onClick={onBack} style={{ background: "transparent", border: "none", padding: 0, cursor: "pointer", display: "flex" }}>
          <ChevronLeft size={26} color="var(--fg)"/>
        </button>
        <h1 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 28, letterSpacing: "-0.025em", margin: 0 }}>Procházet</h1>
      </div>
      <div style={{ padding: "0 20px 100px" }}>
        <p style={{ fontSize: 15, color: "var(--muted)", marginTop: 4, marginBottom: 20 }}>Najdi svou kategorii — od dispenzářů po brunch spoty.</p>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          {CATEGORIES.map((c, i) => {
            const p = palette[c.color];
            const count = SPOTS.filter(s => s.cat === c.id).length;
            const big = i === 0 || i === 3;
            return (
              <div key={c.id} onClick={() => onSelect(c.id)} style={{
                gridColumn: big ? "span 2" : "span 1",
                background: p.bg, color: p.fg, borderRadius: 20, padding: 18,
                aspectRatio: big ? "2.2/1" : "1/1.05",
                position: "relative", overflow: "hidden", cursor: "pointer",
                display: "flex", flexDirection: "column", justifyContent: "space-between",
              }}>
                <div style={{ position: "absolute", right: -16, bottom: -16, fontSize: big ? 110 : 76, opacity: 0.18, lineHeight: 1 }}>{c.icon}</div>
                <div>
                  <div style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: big ? 24 : 19, letterSpacing: "-0.02em", lineHeight: 1.05 }}>{c.label}</div>
                  <div style={{ fontSize: 12, opacity: 0.7, marginTop: 4, fontWeight: 500 }}>{count} spotů</div>
                </div>
                <div style={{ alignSelf: "flex-start", padding: "6px 12px", background: "rgba(255,255,255,0.55)", color: p.fg, borderRadius: 100, fontSize: 12, fontWeight: 700, position: "relative", zIndex: 1 }}>Prozkoumat ›</div>
              </div>
            );
          })}
        </div>

        <h2 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 22, letterSpacing: "-0.02em", marginTop: 28, marginBottom: 12 }}>Kurátorované sbírky</h2>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {[
            { t: "Brunch & CBD", d: "12 míst · komunitní výběr", c: "var(--terracotta-600)" },
            { t: "Friendly bary po půlnoci", d: "8 míst · ověřeno", c: "var(--mustard-600)" },
            { t: "Mimo Prahu", d: "24 míst · celé Česko", c: "var(--moss-700)" },
          ].map(it => (
            <div key={it.t} style={{ background: "var(--surface)", borderRadius: 16, padding: 14, display: "flex", alignItems: "center", gap: 12, border: `1px solid var(--border)`, cursor: "pointer" }}>
              <div style={{ width: 48, height: 48, borderRadius: 12, background: it.c, display: "flex", alignItems: "center", justifyContent: "center", color: "#F7F2E7", fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 22, letterSpacing: "-0.02em" }}>✦</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 16, color: "var(--fg)", letterSpacing: "-0.015em" }}>{it.t}</div>
                <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 1 }}>{it.d}</div>
              </div>
              <ChevronRight size={18} color="var(--muted)"/>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ────────────────────────────────────────────────────────────────────────────
// SCREEN: SAVED
// ────────────────────────────────────────────────────────────────────────────
function Saved({ onNav, onOpenSpot, savedIds, onToggleSave, dark }) {
  const [tab, setTab] = useState("saved");
  const saved = SPOTS.filter(s => savedIds.has(s.id));
  const visited = SPOTS.slice(2, 6);
  const list = tab === "saved" ? saved : visited;

  return (
    <div className="screen screen-enter scroll" style={{ background: "var(--bg)", color: "var(--fg)", overflowY: "auto" }}>
      <StatusBar/>
      <div style={{ padding: "64px 20px 4px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <h1 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 32, letterSpacing: "-0.025em", margin: 0 }}>Knihovna</h1>
        <button onClick={() => onNav("submit")} style={{ width: 40, height: 40, borderRadius: 100, background: "transparent", border: `1px solid var(--border)`, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
          <PlusIcon size={20} color="var(--fg)"/>
        </button>
      </div>
      <p style={{ fontSize: 15, color: "var(--muted)", padding: "0 20px", marginTop: 4, marginBottom: 18 }}>Tvoje uložené, navštívené a sbírky.</p>

      <div style={{ padding: "0 20px", display: "flex", gap: 6, borderBottom: `1px solid var(--border)`, overflowX: "auto" }} className="no-scrollbar">
        {[
          { id: "saved", label: `Uložené · ${saved.length}` },
          { id: "visited", label: `Navštíveno · ${visited.length}` },
          { id: "lists", label: "Sbírky · 2" },
        ].map(tb => (
          <button key={tb.id} onClick={() => setTab(tb.id)} style={{
            padding: "12px 4px", marginRight: 14, background: "transparent", border: "none", cursor: "pointer",
            fontSize: 14, fontWeight: 600,
            color: tab === tb.id ? "var(--fg)" : "var(--muted)",
            borderBottom: tab === tb.id ? `2px solid var(--accent)` : "2px solid transparent",
            marginBottom: -1, whiteSpace: "nowrap",
          }}>{tb.label}</button>
        ))}
      </div>

      <div style={{ padding: "16px 20px 100px", display: "flex", flexDirection: "column", gap: 12 }}>
        {tab !== "lists" && list.length > 0 && list.map(s => (
          <SpotCard key={s.id} spot={s} onClick={() => onOpenSpot(s.id)} saved={savedIds.has(s.id)} onToggleSave={onToggleSave}/>
        ))}
        {tab === "saved" && list.length === 0 && (
          <div style={{ padding: "40px 16px", textAlign: "center" }}>
            <div style={{ fontSize: 42, opacity: 0.4 }}>♡</div>
            <div style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 20, marginTop: 8 }}>Zatím nic uloženého.</div>
            <div style={{ fontSize: 14, color: "var(--muted)", marginTop: 4 }}>Klepni na záložku u spotu a najdeš ho tady.</div>
          </div>
        )}
        {tab === "lists" && (
          <>
            {[
              { t: "Praha 7 stálice", n: 6, c: "var(--moss-700)" },
              { t: "Brunch víkend", n: 4, c: "var(--terracotta-600)" },

}

  const [cat, setCat] = useState("cafe");
  const [addr, setAddr] = useState("");
  const [desc, setDesc] = useState("");

    width: "100%", height: 48, padding: "0 14px",
    background: "var(--surface)", border: `1px solid var(--border)`,
    borderRadius: 12, fontSize: 15, fontWeight: 500,
    color: "var(--fg)", outline: "none", boxSizing: "border-box",

    <div className="screen screen-enter" style={{ background: "var(--bg)", color: "var(--fg)" }}>
      <StatusBar/>
      <div style={{ padding: "64px 20px 12px", display: "flex", alignItems: "center", gap: 10 }}>
        <button onClick={onBack} style={{ background: "transparent", border: "none", padding: 0, cursor: "pointer", display: "flex" }}>

      </div>

function Field({ label, hint, children }) {
  return (
    <div>
      <div style={{ fontSize: 13, fontWeight: 600, color: "var(--fg)", marginBottom: 6, letterSpacing: "-0.005em" }}>{label}</div>

    </div>

}

// ────────────────────────────────────────────────────────────────────────────
// APP — router
// ────────────────────────────────────────────────────────────────────────────
function App() {
  const [theme, setTheme] = useState(() => localStorage.getItem("ws-theme") || "light");
  const [stack, setStack] = useState(() => {
    const seen = localStorage.getItem("ws-onboarded");
    return seen ? [{ id: "home" }] : [{ id: "onboard" }];
  });
  const [savedIds, setSavedIds] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem("ws-saved") || "[1,4]")); }
    catch { return new Set([1, 4]); }
  });
  const [toast, setToast] = useState(null);

  const dark = theme === "dark";
  const top = stack[stack.length - 1];

  useEffect(() => {
    document.documentElement.classList.toggle("dark", dark);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#1F2A1C" : "#F7F2E7");
  }, [dark]);
  useEffect(() => { localStorage.setItem("ws-theme", theme); }, [theme]);
  useEffect(() => { localStorage.setItem("ws-saved", JSON.stringify([...savedIds])); }, [savedIds]);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 1800);
  }, []);

  const nav = useCallback((id, params = {}) => {
    setStack(s => {
      // For tabs, replace top; for stack pushes (detail, submit), push.
      const pushable = ["detail", "submit"];
      if (pushable.includes(id)) return [...s, { id, ...params }];
      // tab navigation: keep base, replace top
      return [{ id, ...params }];
    });
  }, []);

  const back = useCallback(() => {
    setStack(s => s.length > 1 ? s.slice(0, -1) : s);
  }, []);

  const openSpot = useCallback((spotId) => {
    setStack(s => [...s, { id: "detail", spotId }]);
  }, []);

  const toggleSave = useCallback((id) => {
    setSavedIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) { next.delete(id); showToast("Odebráno z uložených"); }
      else { next.add(id); showToast("Uloženo"); }
      return next;
    });
  }, [showToast]);

  const finishOnboarding = useCallback(() => {
    localStorage.setItem("ws-onboarded", "1");
    setStack([{ id: "home" }]);
  }, []);

  const reset = useCallback(() => {
    localStorage.removeItem("ws-onboarded");
    setStack([{ id: "onboard" }]);
  }, []);

  let screen;
  if (top.id === "onboard") {
    screen = <Onboarding onDone={finishOnboarding} dark={dark}/>;
  } else if (top.id === "home") {
    screen = <Home onNav={nav} onOpenSpot={openSpot} savedIds={savedIds} onToggleSave={toggleSave} dark={dark}/>;
  } else if (top.id === "map") {
    screen = <MapScreen onNav={nav} onOpenSpot={openSpot} dark={dark}/>;
  } else if (top.id === "search") {
    screen = <Search onBack={() => nav("home")} onOpenSpot={openSpot} savedIds={savedIds} onToggleSave={toggleSave} dark={dark}/>;
  } else if (top.id === "categories") {
    screen = <Categories onBack={back} onSelect={(cat) => { nav("home"); /* future: filter */ showToast("Kategorie vybrána"); }} dark={dark}/>;
  } else if (top.id === "saved") {
    screen = <Saved onNav={nav} onOpenSpot={openSpot} savedIds={savedIds} onToggleSave={toggleSave} dark={dark}/>;
  } else if (top.id === "profile") {
    screen = <Profile onNav={nav} onSetTheme={setTheme} dark={dark} savedCount={savedIds.size}/>;
  } else if (top.id === "submit") {
    screen = <Submit onBack={back} dark={dark} showToast={showToast}/>;
  } else if (top.id === "detail") {
    screen = <SpotDetail spotId={top.spotId} onBack={back} savedIds={savedIds} onToggleSave={toggleSave} dark={dark} showToast={showToast}/>;
  }

  return (
    <div className="stage">
      <div className="phone">
        <div className="notch"/>
        {screen}
        {toast && <div className="toast">{toast}</div>}
        <div className="home-bar"/>
      </div>

      <div className="tweaks">
        <div className="tw-label">Téma</div>
        <div className="tw-row">
          <button className={!dark ? "active" : ""} onClick={() => setTheme("light")}>Cream</button>
          <button className={dark ? "active" : ""} onClick={() => setTheme("dark")}>Moss</button>
        </div>
        <div className="tw-label" style={{ marginTop: 4 }}>Reset</div>
        <div className="tw-row">
          <button onClick={reset}>Onboarding</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
